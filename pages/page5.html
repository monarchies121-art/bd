<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Question for You</title>
  <link rel="stylesheet" href="../css/bd.css">
  <style>
    /* Button Pulse Keyframe Animation */
    @keyframes pulseBtn {
      0% { transform: scale(1); }
      40% { transform: scale(1.18); }
      100% { transform: scale(1); }
    }

    .btn-yes.pulse {
      animation: pulseBtn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Floating Heart Particles Animation */
    @keyframes floatUpAndFade {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.6) rotate(0deg);
      }
      50% {
        opacity: 0.95;
        transform: translate(calc(-50% + var(--x-offset)), -90px) scale(1.3) rotate(var(--rotation));
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--x-offset) * 1.4), -160px) scale(0.8) rotate(var(--rotation));
      }
    }

    .floating-heart {
      position: fixed;
      pointer-events: none;
      font-size: 1.8rem;
      z-index: 9999;
      animation: floatUpAndFade 0.9s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      user-select: none;
    }

    /* Pop-up Overlay Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #ffffff;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      max-width: 380px;
      width: 90%;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      transform: scale(0.8);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .modal-card h3 {
      font-size: 1.5rem;
      margin-bottom: 10px;
      color: #ff4757;
    }

    .modal-card p {
      font-size: 1.1rem;
      color: #555;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .modal-card button {
      width: 100%;
    }
  </style>
</head>
<body>

  <main id="birthday-container">
    <section class="page page5-card">
      <h2 class="page5-question">Am I important to you?</h2>
      
      <!-- Status message showing attempt count & prompt -->
      <p id="attempt-status" style="font-size: 0.95rem; color: #ff4757; font-weight: 600; min-height: 24px; text-align: center; margin-bottom: 10px;"></p>

      <div class="page5-buttons">
        <!-- Yes button tracks 7 attempts with pulse animation -->
        <button type="button" id="yes-btn" class="btn-yes">
          Yes ❤️
        </button>

        <!-- No button sends user directly to index.html -->
        <a href="index.html" class="btn-no">
          No
        </a>
      </div>
    </section>
  </main>

  <!-- Pop-up Note Modal -->
  <div id="popup-modal" class="modal-overlay">
    <div class="modal-card">
      <h3>🎵 For You</h3>
      <p>This song is for you ❤️</p>
      <button id="modal-ok-btn" class="btn-yes">Listen Now 🎶</button>
    </div>
  </div>

  <script>
    let attempts = 0;
    const maxAttempts = 7;
    const youtubeUrl = 'https://youtu.be/rtOvBOTyX00?si=_g7d0WgtK5Z80oHT';

    const prompts = [
      "Are you really, really sure? (1/7) ❤️",
      "Are you 100% sure? (2/7) 💕",
      "Promise with all your heart? (3/7) 💖",
      "Say it louder! (4/7) 💗",
      "Almost there, keep clicking! (5/7) 💓",
      "One last click to unlock your surprise! (6/7) ✨",
      "Redirecting to your surprise... (7/7) 🥰"
    ];

    const heartsList = ['❤️', '💖', '💕', '💗', '💓', '🥰', '✨'];

    const yesBtn = document.getElementById('yes-btn');
    const statusText = document.getElementById('attempt-status');
    const popupModal = document.getElementById('popup-modal');
    const modalOkBtn = document.getElementById('modal-ok-btn');

    // Function to create burst of floating hearts at click location
    function spawnHeartBurst(e) {
      const rect = yesBtn.getBoundingClientRect();
      const clickX = e.clientX || (rect.left + rect.width / 2);
      const clickY = e.clientY || (rect.top + rect.height / 2);

      const particleCount = 7;
      for (let i = 0; i < particleCount; i++) {
        const heart = document.createElement('span');
        heart.classList.add('floating-heart');
        heart.textContent = heartsList[Math.floor(Math.random() * heartsList.length)];

        // Random horizontal trajectory & rotation
        const xOffset = (Math.random() - 0.5) * 140 + 'px';
        const rotation = (Math.random() - 0.5) * 70 + 'deg';

        heart.style.left = `${clickX}px`;
        heart.style.top = `${clickY}px`;
        heart.style.setProperty('--x-offset', xOffset);
        heart.style.setProperty('--rotation', rotation);

        document.body.appendChild(heart);

        // Remove element when animation ends
        setTimeout(() => {
          heart.remove();
        }, 900);
      }
    }

    yesBtn.addEventListener('click', function(e) {
      attempts++;

      // Trigger pulse animation on button
      yesBtn.classList.remove('pulse');
      void yesBtn.offsetWidth; // Trigger reflow
      yesBtn.classList.add('pulse');

      // Trigger floating hearts particle burst
      spawnHeartBurst(e);

      if (attempts < maxAttempts) {
        statusText.textContent = prompts[attempts - 1];
        yesBtn.textContent = `Yes (${attempts}/${maxAttempts}) ❤️`;
      } else {
        statusText.textContent = prompts[maxAttempts - 1];
        yesBtn.disabled = true;

        // Display pop-up note modal on the 7th click
        setTimeout(() => {
          popupModal.classList.add('active');
        }, 400);
      }
    });

    // Navigate to YouTube video when user clicks "Listen Now"
    modalOkBtn.addEventListener('click', function() {
      window.location.href = youtubeUrl;
    });
  </script>

</body>
</html>
